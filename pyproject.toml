[tool.poetry]
name = "biztrack-api"
version = "0.1.0"
description = "BizTrack ERP backend API"
authors = ["Ricardo Palma <webschile@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# --- Core framework ---
django = "^5.2"

# --- DRF ---
djangorestframework = "^3.16"
djangorestframework-simplejwt = "^5.5.1"
drf-spectacular = "^0.29.0"

# --- Database ---
psycopg = { version = "^3.1", extras = ["binary"] }

# --- Distributed tasks & cache ---
celery = { version = "^5.5", extras = ["redis"] }
django-redis = "^6.0.0"
django-celery-beat = "^2.8.1"

# --- Storage (AWS S3) ---
boto3 = "^1.42"
django-storages = "^1.14"

# --- HTTP utilities ---
requests = "^2.32"

# ======================================================================
# DEV DEPENDENCIES
# ======================================================================
django-cors-headers = "^4.9.0"
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
# Code quality
black = "^25.11"
flake8 = "^7.3"
isort = "^7.0"
pylint-celery = "^0.3"

# Git hooks
pre-commit = "^4.5"

# Testing
pytest = "^9.0"
pytest-celery = "^1.2"
pytest-cov = "^7.0"
pytest-django = "^4.11"
pytest-xdist = "^3.8"
factory-boy = "^3.3"

# Security
bandit = "^1.9"
safety = "^3.7"

# Django debugging tools
django-debug-toolbar = "^6.1"
django-extensions = "^4.1"

# REPL debugging
ipdb = "^0.13"

# File watching (autorefresh commands)
watchdog = "^6.0"

# Celery tools
flower = "^2.0"

# DRF
drf-writable-nested = "^0.7.2"
drf-access-policy = "^1.5.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
